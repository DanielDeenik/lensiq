# Cloudflare Workers static-assets deploy for the LensIQ recruiter site.
# Workers Builds runs `npx wrangler deploy` on every push to main.
# Only ./dist is published: no worker script, no repo source, no .git.
name = "lensiq"
compatibility_date = "2025-06-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
